<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="avatarBg" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2E63"/>
      <stop offset="55%" stop-color="#151726"/>
      <stop offset="100%" stop-color="#08090F"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2E63"/>
      <stop offset="50%" stop-color="#FF5E2B"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="140" y1="120" x2="260" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <filter id="coralGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Glow circle -->
  <circle cx="200" cy="200" r="182" fill="#FF2E63" fill-opacity="0.16" filter="url(#coralGlow)"/>
  <!-- Base Circle -->
  <circle cx="200" cy="200" r="170" fill="url(#avatarBg)" stroke="url(#ringGrad)" stroke-width="4"/>
  
  <!-- Ambient Grid pattern -->
  <circle cx="200" cy="200" r="142" fill="none" stroke="#22D3EE" stroke-opacity="0.25" stroke-dasharray="4 8"/>
  
  <!-- Body/Shoulders -->
  <path d="M100 370 C110 290, 150 260, 200 260 C250 260, 290 290, 300 370 Z" fill="#10121C" stroke="#FF2E63" stroke-width="2"/>
  <path d="M150 260 L200 310 L250 260 Z" fill="#1B1E2E"/>
  <polygon points="185,280 200,340 215,280" fill="#FF2E63"/>
  
  <!-- Neck -->
  <rect x="175" y="210" width="50" height="60" rx="8" fill="#FDBA74"/>
  
  <!-- Head / Face -->
  <ellipse cx="200" cy="180" rx="55" ry="65" fill="url(#faceGrad)"/>
  
  <!-- Hair -->
  <path d="M140 165 C135 120, 160 90, 200 90 C240 90, 265 120, 260 165 C250 135, 230 120, 200 120 C170 120, 150 135, 140 165 Z" fill="#0B0C14"/>
  <path d="M145 150 C140 180, 145 200, 145 200 C140 190, 138 175, 145 150 Z" fill="#0B0C14"/>
  <path d="M255 150 C260 180, 255 200, 255 200 C260 190, 262 175, 255 150 Z" fill="#0B0C14"/>
  
  <!-- Glasses -->
  <rect x="160" y="165" width="32" height="24" rx="6" fill="none" stroke="#0F172A" stroke-width="3.5"/>
  <rect x="208" y="165" width="32" height="24" rx="6" fill="none" stroke="#0F172A" stroke-width="3.5"/>
  <line x1="192" y1="175" x2="208" y2="175" stroke="#0F172A" stroke-width="3.5"/>
  <line x1="145" y1="175" x2="160" y2="175" stroke="#0F172A" stroke-width="3"/>
  <line x1="240" y1="175" x2="255" y2="175" stroke="#0F172A" stroke-width="3"/>

  <!-- Eyes -->
  <circle cx="176" cy="177" r="4" fill="#0F172A"/>
  <circle cx="224" cy="177" r="4" fill="#0F172A"/>
  
  <!-- Smile -->
  <path d="M185 210 Q200 225 215 210" stroke="#9A3412" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Tech Floating Accents -->
  <g transform="translate(60, 90)">
    <rect width="42" height="42" rx="10" fill="#10121C" stroke="#FF2E63" stroke-width="1.5"/>
    <text x="21" y="27" text-anchor="middle" fill="#FF2E63" font-family="monospace" font-size="16" font-weight="bold">&lt;/&gt;</text>
  </g>
  <g transform="translate(298, 230)">
    <rect width="42" height="42" rx="10" fill="#10121C" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="21" y="27" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="18" font-weight="bold">{;}</text>
  </g>
</svg>
